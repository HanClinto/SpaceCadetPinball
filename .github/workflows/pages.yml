# The web version on GitHub Pages (https://hanclinto.github.io/SpaceCadetPinball/). Built without the game's own
# files, which aren't ours to publish: the page asks each player for their copy and keeps it in their browser.
name: Web version (GitHub Pages)

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container: emscripten/emsdk:3.1.74
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: |
          emcmake cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j 4

      - name: Assemble the site
        run: |
          mkdir site
          cp bin/SpaceCadetPinball.js bin/SpaceCadetPinball.wasm bin/SpaceCadetPinball.data site/
          cp bin/SpaceCadetPinball.html site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
