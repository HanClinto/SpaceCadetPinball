# The web version on GitHub Pages (https://hanclinto.github.io/SpaceCadetPinball/), playable right away with the
# Windows XP game files alula's web build has published since 2021 (taken from its gh-pages branch, which this fork
# keeps). Nothing else is added: players can add their own Full Tilt! Pinball files in the page's menu.
name: Web version (GitHub Pages)

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container: emscripten/emsdk:3.1.74
    steps:
      - uses: actions/checkout@v4

      - name: Get the game files from the gh-pages branch (alula's build)
        uses: actions/checkout@v4
        with:
          ref: a93547299a2ed7bd602630c0be3a43648e25a886
          path: gh-pages
          sparse-checkout: |
            SpaceCadetPinball.js
            SpaceCadetPinball.data
          sparse-checkout-cone-mode: false

      - name: Unpack them into game_resources
        run: python3 Platform/Web/unpack_data.py gh-pages/SpaceCadetPinball.js gh-pages/SpaceCadetPinball.data game_resources

      - name: Build
        run: |
          emcmake cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j 4

      - name: Assemble the site
        run: |
          mkdir site
          cp bin/SpaceCadetPinball.js bin/SpaceCadetPinball.wasm bin/SpaceCadetPinball.data site/
          cp bin/SpaceCadetPinball.html site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
